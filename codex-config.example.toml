# Codex hook config for the astronomy RAG+KG demo.
#
# Add this block to your Codex config file at:  ~/.codex/config.toml
# (create the file if it doesn't exist), then run `codex` from INSIDE your
# clone of this repo so `git rev-parse` resolves to the demo directory.
#
# This runs the SAME ground_with_kg.py that Claude Code uses — Codex and
# Claude Code accept the identical UserPromptSubmit hook contract.

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/ground_with_kg.py"'
timeout = 10
statusMessage = "Grounding your prompt with the astronomy KG"
